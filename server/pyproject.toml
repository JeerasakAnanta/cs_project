[project]
name = "chatbot-api"
version = "0.2.0"
description = "API Chatbot for RMUTL NAN"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "docling>=2.15.1",
    "fastapi>=0.115.12",
    "langchain>=1.3.9",
    "langchain-community>=0.3.24,<1.0",
    "langchain-openai>=1.1.14",
    "langchain-qdrant>=1.0",
    "langgraph>=1.0.10",
    "python-dotenv>=1.1.0",
    "qdrant-client>=1.14.2",
    "uvicorn>=0.34.2",
    "slowapi>=0.1.10",
    "bcrypt>=4.3.0,<5.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.41",
    "pydantic[email]>=2.11.4",
    "pytz>=2025.2",
    "dnspython>=2.9.2",
    "langchain-core>=1.2.22",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.4.4",
    "soupsieve>=4.0.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
